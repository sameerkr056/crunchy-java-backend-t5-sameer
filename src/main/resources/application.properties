spring.application.name=crunchy-java-backend-t5-sameer
# Railway (and most hosts) tell the app which port to use through the PORT variable. Locally it stays 8080.
server.port=${PORT:8080}

# ---------- MySQL (override with environment variables) ----------
# DB_OPTIONS is optional: use it when you connect to a database that requires SSL (see README).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cabbooking_db}?${DB_OPTIONS:useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JWT (secrets come from environment variables, never from this file) ----------
# JWT_SECRET has NO default on purpose: the app refuses to start without it.
# It must be a Base64 text of at least 32 random bytes (see .env.example).
app.jwt.secret=${JWT_SECRET}
# Tokens always expire. Must be greater than 0.
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---------- Optional first ADMIN account (created at startup only if both values are set) ----------
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Flyway owns the schema ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JPA / Hibernate ----------
# validate = Hibernate only CHECKS that entities match the Flyway tables. It never changes the schema.
spring.jpa.hibernate.ddl-auto=validate
# Keep the Hibernate session inside the service layer (no lazy loading while the JSON is written)
spring.jpa.open-in-view=false

# ---------- SQL logging (for the N+1 demonstration) ----------
# Prints every SQL statement in the IntelliJ console as "Hibernate: select ..."
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
# Prints "Session Metrics" after each request, including how many JDBC statements were prepared
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO

# ---------- Swagger UI / OpenAPI (Springdoc) ----------
# Swagger UI:   /swagger-ui/index.html      OpenAPI JSON: /v3/api-docs
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.default-produces-media-type=application/json

# ---------- Actuator: expose ONLY the health endpoint, without details ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# NOTE: the settings above are for LOCAL development (SQL logging is on so you can study the N+1 problem).
# On Railway the Docker image starts with the "prod" profile, see application-prod.properties.
