# Production settings. Active when SPRING_PROFILES_ACTIVE=prod (the Dockerfile sets it).
# Everything not listed here is inherited from application.properties.

# Quiet and fast: no SQL printing and no Hibernate statistics in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
logging.level.root=INFO
logging.level.com.crunchycode.cabbooking=INFO

# Never show stack traces or internal messages in error pages (our GlobalExceptionHandler also hides them)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Railway ends HTTPS at its proxy and forwards plain HTTP to the app.
# This makes Spring (and Swagger) understand the original https:// address.
server.forward-headers-strategy=framework

# Finish running requests before stopping during a redeploy
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Small, safe connection pool for a small managed database
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
